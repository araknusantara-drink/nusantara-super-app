<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nusantara Drink</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div>
    <p class="eyebrow">NUSANTARA DRINK</p>
    <h1>Minuman pilihan, lebih mudah.</h1>
  </div>

  <button class="icon-btn" aria-label="Akun">👤</button>
</header>

<main class="container">

  <section class="notice">
    <strong>Produk dengan batasan usia</strong>
    <span>
      Verifikasi usia dan ketentuan penjualan akan diterapkan sebelum checkout produksi.
    </span>
  </section>

  <section>
    <div class="section-head">
      <h2>Produk pilihan</h2>
      <button class="text-btn">Lihat semua</button>
    </div>

    <div id="products" class="grid"></div>
  </section>

  <section class="card">
    <h2>Keranjang</h2>
    <div id="cart">Keranjang masih kosong.</div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="active">Home</button>
  <button>Pesanan</button>
  <button>Profil</button>
</nav>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Aplikasi Nusantara Drink -->
<script src="app.js"></script>

</body>
</html>
