<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nusantara Drink — Mode Kurir</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:system-ui;margin:0;background:#f5f5f5}main{max-width:700px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px}select,button{width:100%;padding:13px;margin-top:8px;border-radius:10px;border:1px solid #ccc}#map{height:360px;border-radius:14px;margin-top:12px}</style></head><body><main><div class="card"><h2>🚚 Mode Kurir</h2><div id="access">Memeriksa akses...</div></div><div id="app" hidden><div class="card"><select id="orders"></select><button id="refresh">🔄 Refresh</button></div><div class="card"><b id="status">Tracking belum aktif</b><div id="coords">GPS belum aktif</div><div id="map"></div><button id="start">▶️ Mulai Tracking GPS</button><button id="stop">⏹️ Hentikan</button></div><div class="card"><a href="./admin.html">← Dashboard</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const U="https://xevkttwbzfosxmslnrku.supabase.co",K="sb_publishable_nqqizWWCx2Wztrdc1ya4XQ_BHaRWM0N",db=supabase.createClient(U,K);let watch=null,map,marker;
const $=x=>document.getElementById(x);
async function init(){const s=await db.auth.getSession(),u=s.data?.session?.user;if(!u){$("access").textContent="Login diperlukan.";return}const p=await db.from("profiles").select("role,is_active").eq("id",u.id).maybeSingle();if(p.error||!p.data?.is_active||!["owner","admin","staff"].includes(p.data.role)){$("access").textContent="Akses kurir ditolak.";return}$("access").textContent="Akses kurir aktif.";$("app").hidden=false;map=L.map("map").setView([-6.2,106.8],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);await orders()}
async function orders(){const r=await db.from("orders").select("id,order_number,status").in("status",["processing","shipped"]).order("created_at",{ascending:false});$("orders").innerHTML=(r.data||[]).map(o=>'<option value="'+o.id+'">'+o.order_number+" — "+o.status+"</option>").join("")}
async function send(pos){const s=await db.auth.getSession(),t=s.data?.session?.access_token,id=Number($("orders").value),lat=pos.coords.latitude,lng=pos.coords.longitude;$("coords").textContent="GPS: "+lat.toFixed(6)+", "+lng.toFixed(6);if(!marker)marker=L.circleMarker([lat,lng],{radius:10}).addTo(map);else marker.setLatLng([lat,lng]);map.setView([lat,lng],15);const r=await fetch(U+"/functions/v1/courier-location-update",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({order_id:id,latitude:lat,longitude:lng,status:"on_delivery"})}),d=await r.json();$("status").textContent=r.ok&&d.ok?"🟢 Tracking aktif":"❌ "+(d.error||"Gagal update")}
$("start").onclick=()=>{if(!navigator.geolocation)return alert("GPS tidak tersedia.");if(watch!==null)return;watch=navigator.geolocation.watchPosition(send,e=>$("status").textContent="GPS: "+e.message,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});$("status").textContent="Mencari GPS..."};
$("stop").onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;$("status").textContent="Tracking dihentikan."};$("refresh").onclick=orders;init();
</script></body></html>
